- code: shelfsense_overview
  title: ShelfSense Sorting overview
  description: Show which categories use ShelfSense Sorting, their option and when they were last sorted.
  content: |
    Read the ShelfSense Sorting documentation first (docsearch: "ShelfSense Sorting").
    Call GET /V1/shelfsense/categories and show a short table: category name, id, mode, pinned SKUs, last sorted.
    Then suggest, in plain English, which other big categories could use another mode and why.
    Do not change anything.
  required_tools: builtin_system_restapi
  is_active: true
- code: shelfsense_set_category
  title: ShelfSense Sorting – change a category
  description: Preview and change the ShelfSense Sorting option of a category.
  content: |
    Read the ShelfSense Sorting documentation first (docsearch: "ShelfSense Sorting").
    Category: {{category}}. Wanted option: {{mode}}.
    1. Find the category id (GET /V1/shelfsense/categories?all=1 if a name was given).
    2. Preview with POST /V1/shelfsense/categories/{id}/preview and show the first 12 products.
    3. Ask for a yes, then save with PUT /V1/shelfsense/categories/{id}.
  arguments:
    - name: category
      description: "Category id or name"
      required: true
    - name: mode
      description: "standard, newest, smart or bestseller"
      required: true
  required_tools: builtin_system_restapi
  is_active: true
- code: shelfsense_stats
  title: ShelfSense Sorting – statistics
  description: Statistics and advice for one category or the whole shop.
  content: |
    Read the ShelfSense Sorting documentation first (docsearch: "ShelfSense Sorting", section "Statistics for the merchant").
    Scope: {{category}} (empty = the 15 categories with most sales).
    Show, in short tables and plain English:
    1. Mode per category and when it was last sorted.
    2. Sales last 30 days (units and revenue) and the share from our own brand (SE Mattor).
    3. Click rate (clicks / views) per category from semattor_shelfsense_stats, if there is data.
    4. Top 10 products and products with many views but few clicks.
    5. Own brand share of the first 24 places in the preview.
    Finish with 3-5 concrete suggestions (mode changes, pins, products to check). Do not change anything.
  arguments:
    - name: category
      description: "Category id or name (optional)"
      required: false
  required_tools: builtin_system_dbreader,builtin_system_restapi
  is_active: true
