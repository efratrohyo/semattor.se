[project]
name = "ga4-mcp"
version = "1.1.0"
description = "GA4 + Search Console MCP server for Claude Desktop (SE/DK/FI/NL/NO)"
requires-python = ">=3.10"
dependencies = [
    # <2 ceiling is deliberate: MCP SDK 2.0 renamed Tool.inputSchema -> input_schema
    # and broke fresh installs of GA4 MCP servers. Lift it only after testing.
    "mcp[cli]>=1.24,<2",
    "google-analytics-data>=0.23.1",
    # Search Console. Pure REST over httplib2 — no gRPC, consistent with the
    # Windows hardening above.
    "google-api-python-client>=2.200",
    "google-auth-httplib2>=0.2",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
